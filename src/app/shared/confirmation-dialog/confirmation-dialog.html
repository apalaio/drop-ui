<div class="flex flex-col gap-4">
  <h2 class="text-lg font-semibold">{{ title() }}</h2>

  @if (description()) {
    <p class="text-sm text-base-content/70" data-testid="dialog-description">{{ description() }}</p>
  }

  <div class="flex justify-end gap-2">
    <button type="button" class="btn btn-ghost" cdkFocusInitial (click)="cancel()">Cancel</button>
    <button type="button" class="btn btn-primary" (click)="confirm()">{{ confirmLabel() }}</button>
  </div>
</div>
