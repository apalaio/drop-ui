<section
  id="canvas-drop-list"
  class="canvas-drop-zone flex min-h-full flex-col gap-2 rounded-box border-2 border-dashed border-base-300 bg-base-100 p-6 transition-colors"
  aria-label="Canvas"
  cdkDropList
  (cdkDropListDropped)="drop($event)"
>
  @for (element of store.canvasElements(); track element.uid) {
    <dui-dropped-element cdkDrag [cdkDragData]="element" [element]="element" />
  } @empty {
    <p class="m-auto text-sm text-base-content/50">Drop elements here</p>
  }
</section>
