@let el = element();

<span class="badge badge-ghost badge-xs absolute top-2 right-10 opacity-0 group-hover:opacity-100">
  {{ el.type }}
</span>

<button
  type="button"
  class="btn btn-ghost btn-xs btn-square absolute top-1 right-1"
  aria-label="Element actions"
  [cdkMenuTriggerFor]="actions"
  (mousedown)="$event.stopPropagation()"
  (touchstart)="$event.stopPropagation()"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    class="size-4"
    aria-hidden="true"
  >
    <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>

<ng-template #actions>
  <ul cdkMenu class="menu w-36 rounded-box bg-base-100 p-1 shadow-md">
    @if ('text' in el) {
      <li role="none">
        <button type="button" cdkMenuItem (cdkMenuItemTriggered)="editText(el)">Edit text</button>
      </li>
    }
    <li role="none">
      <button type="button" class="text-error" cdkMenuItem (cdkMenuItemTriggered)="deleteElement()">
        Delete element
      </button>
    </li>
  </ul>
</ng-template>

@switch (el.type) {
  @case ('div') {
    <div class="min-h-16 rounded-field bg-base-200 p-2" data-testid="dropped-div">
      {{ el.text }}
    </div>
  }
  @case ('span') {
    <span class="rounded-field bg-base-200 px-2 py-1" data-testid="dropped-span">{{
      el.text
    }}</span>
  }
  @case ('text-input') {
    <input
      type="text"
      class="input"
      aria-label="Text input"
      data-testid="dropped-text-input"
      [placeholder]="el.text"
      (mousedown)="$event.stopPropagation()"
      (touchstart)="$event.stopPropagation()"
    />
  }
  @case ('textfield') {
    <textarea
      class="textarea"
      aria-label="Textfield"
      data-testid="dropped-textfield"
      [placeholder]="el.text"
      (mousedown)="$event.stopPropagation()"
      (touchstart)="$event.stopPropagation()"
    ></textarea>
  }
  @case ('datepicker') {
    <input
      type="date"
      class="input"
      aria-label="Datepicker"
      data-testid="dropped-datepicker"
      (mousedown)="$event.stopPropagation()"
      (touchstart)="$event.stopPropagation()"
    />
  }
  @default never(el);
}
