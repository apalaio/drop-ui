<button
  type="button"
  class="btn btn-ghost btn-sm gap-1.5 px-1.5"
  aria-label="Change theme"
  [cdkMenuTriggerFor]="themeList"
>
  <span
    class="grid shrink-0 grid-cols-2 gap-0.5 rounded-md border border-base-content/10 bg-base-100 p-1"
    aria-hidden="true"
  >
    <ng-container [ngTemplateOutlet]="swatch" />
  </span>
  Theme
  <svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 2048 2048"
    class="size-2 fill-current opacity-60"
    aria-hidden="true"
  >
    <path d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z" />
  </svg>
</button>

<ng-template #swatch>
  <span class="size-1 rounded-full bg-base-content"></span>
  <span class="size-1 rounded-full bg-primary"></span>
  <span class="size-1 rounded-full bg-secondary"></span>
  <span class="size-1 rounded-full bg-accent"></span>
</ng-template>

<ng-template #themeList>
  <ul
    cdkMenu
    class="menu max-h-96 w-56 flex-nowrap overflow-y-auto rounded-box border border-base-300 bg-base-100 p-1 shadow-md"
    aria-label="Themes"
  >
    @for (theme of themes; track theme) {
      <li role="none">
        <button
          type="button"
          class="gap-3 px-2"
          cdkMenuItemRadio
          [cdkMenuItemChecked]="theme === store.theme()"
          (cdkMenuItemTriggered)="store.setTheme(theme)"
        >
          <span
            class="grid shrink-0 grid-cols-2 gap-0.5 rounded-md bg-base-100 p-1 shadow-sm"
            aria-hidden="true"
            [attr.data-theme]="theme"
          >
            <ng-container [ngTemplateOutlet]="swatch" />
          </span>
          <span class="truncate">{{ theme }}</span>
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="currentColor"
            class="size-3 shrink-0"
            [class.invisible]="theme !== store.theme()"
            aria-hidden="true"
          >
            <path d="M20.285 2l-11.285 11.567-5.286-5.011-3.714 3.716 9 8.728 15-15.285z" />
          </svg>
        </button>
      </li>
    }
  </ul>
</ng-template>
